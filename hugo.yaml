baseURL: http://gennari.industries/
locale: en-US
title: Joey Gennari | Blog

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

params:
  env: production
  title: Joey Gennari | Blog
  author: Me
  DateFormat: "January 2, 2006"
  
  # Logo configuration
  label:
    icon: "/images/GennariIndustries-Black.png"
    iconDark: "/images/GennariIndustries-White.png"
    iconHeight: 45

  ShowReadingTime: true
  ShowShareButtons: true
  ShareButtons: ["linkedin", "twitter"] # To customize which share buttons to be enabled on page
  #ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: true
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  homeInfoParams:
    Title:
    Content: Hi! My name is Joey Gennari and I'm building [Threave](https://threave.io) and [Machinery](https://machinery.app). I'm also an engineer and athlete from the United States. I'm interested in AI, software development, data science, and endurance sports. I also love 3D printing, CAD and design-for-manufacturing. Contact me at hi@gennari.industries.

  socialIcons: # optional
      - name: github
        url: "https://github.com/jgennari"
      - name: twitter
        url: "https://twitter.com/cybrjoe"
      - name: instagram
        url: "https://instagram.com/joeygennari"
      - name: linkedin
        url: "https://www.linkedin.com/in/jgennari/"
      - name: strava
        url: "https://www.strava.com/athletes/jgennari"
      - name: printables
        url: "https://www.printables.com/social/202625-joey-gennari"
      - name: stackoverflow
        url: "https://stackoverflow.com/users/363859/joey-gennari"

languages:
    en:
        label: "English"
        weight: 1
        taxonomies:
          category: categories
          tag: tags
          series: series
        menu:
            main:
                - name: Archive
                  url: /archives/
                  weight: 10
                - name: Tags
                  url: /tags/
                  weight: 20
                - name: Links
                  url: /links/
                  weight: 30

outputs:
    home:
        - HTML
        - RSS
        - JSON

markup:
  goldmark:
    parser:
      attribute:
        block: true
        title: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
    noClasses: false
